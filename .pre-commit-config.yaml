# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks.git
    rev: v6.0.0
    hooks:
      - id: no-commit-to-branch
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-ast
      - id: check-case-conflict
      - id: check-json
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-xml
      - id: check-yaml
        # Multi-document YAML is standard for Kubernetes manifests; exclude k8s/ dir.
        exclude: "^(python/src/badger/_version.py|on-demand/k8s/.*)$"

  - repo: local
    hooks:
      - id: check-module-docstrings
        name: check module docstrings
        entry: python scripts/check_docstrings.py
        language: python
        files: ^src/badger/.*\.py$
        exclude: ^src/badger/tests/

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
