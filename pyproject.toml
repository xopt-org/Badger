[build-system]
requires = ["setuptools>=77.0.0", "setuptools_scm[toml]"]
build-backend = "setuptools.build_meta"

[project]
name = "badger-opt"
description = "Interface for optimization of arbitrary problems in Python."
readme = "README.md"
authors = [{ name = "Zhe Zhang", email = "zhezhang@slac.stanford.edu" }]
keywords = ["optimization", "machine learning", "GUI"]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Natural Language :: English",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]
requires-python = ">=3.11, <3.14"
dependencies = [
    "coolname",
    "pyqt5",
    "pyqtgraph",
    "qdarkstyle>=3.0",
    "pillow",
    "requests",
    "xopt>=3.2.1",
    "bax-algorithms",

]
dynamic = ["version"]
[tool.setuptools_scm]
version_file = "src/badger/_version.py"

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "pytest-qt", "pytest-mock", "pyqt5-stubs"]

[project.urls]
Homepage = "https://github.com/xopt-org/Badger"
Documentation = "https://xopt-org.github.io/Badger/"
"Bug Tracker" = "https://github.com/xopt-org/Badger/issues"

[project.scripts]
badger = "badger.__main__:main"

[tool.setuptools]
zip-safe = false
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["badger"]
namespaces = false

[tool.pytest.ini_options]
addopts = "--cov=badger"
log_cli_level = "INFO"
log_level = "DEBUG"
testpaths = ["src/badger/tests"]
