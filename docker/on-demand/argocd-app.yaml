# ArgoCD Application manifest for Badger on-demand GUI.
#
# This file lives in the source repo as a reference.  Apply it once to your
# ArgoCD cluster (NOT to the app cluster) — typically from your team's GitOps
# repo or with:
#
#   kubectl apply -f docker/on-demand/argocd-app.yaml -n argocd
#
# After that, ArgoCD watches docker/on-demand/k8s on the main branch.
# Every push to main triggers the CI workflow, which bumps the image SHA in
# kustomization.yaml, which ArgoCD detects and uses to roll the pods.
#
# Prerequisites:
#   1. GHCR packages made public (or imagePullSecrets configured on the cluster).
#      GitHub: Packages → badger-novnc / badger-gateway → Package settings → Make public
#   2. The ArgoCD project must allow:
#      - apps/StatefulSet, apps/Deployment, batch/CronJob, networking.k8s.io/Ingress
#      - rbac.authorization.k8s.io/Role, RoleBinding, ServiceAccount
#      - v1/Namespace  (or use syncOptions: [CreateNamespace=true] and drop namespace.yaml)
#   3. "Workflow permissions" in repo Settings → Actions → General must be
#      "Read and write" so the CI can push the kustomization.yaml tag bump.
#      If main is branch-protected, add an exception for github-actions[bot].
#
# Nightly restart drift:
#   The CronJob patches a restartedAt annotation onto the StatefulSet pod template.
#   If ArgoCD shows OutOfSync because of that annotation, add this to spec:
#
#   ignoreDifferences:
#     - group: apps
#       kind: StatefulSet
#       name: badger-gui
#       jsonPointers: [/spec/template/metadata/annotations]
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: badger-gui
  namespace: argocd
spec:
  project: default          # change to your ArgoCD project if needed
  source:
    repoURL: https://github.com/xopt-org/badger.git
    targetRevision: main
    path: docker/on-demand/k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: badger-gui
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true  # removes the need for namespace.yaml to be cluster-scoped
