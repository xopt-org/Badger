apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: badger-gui
  namespace: badger-gui
  labels:
    app: badger-gui
spec:
  serviceName: badger-gui-headless
  replicas: 20
  selector:
    matchLabels:
      app: badger-gui
  template:
    metadata:
      labels:
        app: badger-gui
    spec:
      containers:
        - name: badger-gui
          image: pluflou/badger-novnc:latest
          ports:
            - containerPort: 6080
              name: novnc
            - containerPort: 8080
              name: status
          env:
            - name: RESOLUTION
              value: "1920x1080x24"
            - name: IDLE_TIMEOUT
              value: "600"
            - name: OMP_NUM_THREADS
              value: "4"
            - name: MKL_NUM_THREADS
              value: "4"
            - name: OPENBLAS_NUM_THREADS
              value: "4"
            # Confine EPICS Channel Access to pod-localhost so each pod's lume-pva
            # model server and Badger client only talk to each other (no cross-pod
            # PV name collisions between the 20 sessions).
            - name: EPICS_CA_ADDR_LIST
              value: "127.0.0.1"
            - name: EPICS_CA_AUTO_ADDR_LIST
              value: "NO"
            - name: EPICS_CAS_INTF_ADDR_LIST
              value: "127.0.0.1"
            - name: EPICS_CAS_BEACON_ADDR_LIST
              value: "127.0.0.1"
          resources:
            requests:
              cpu: "1"
              memory: "8Gi"
            limits:
              cpu: "4"
              memory: "16Gi"
          readinessProbe:
            httpGet:
              path: /vnc.html
              port: 6080
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /vnc.html
              port: 6080
            initialDelaySeconds: 30
            periodSeconds: 15
